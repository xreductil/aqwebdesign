<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE 登入</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f8fa; color: #222; }
    main { width: min(420px, calc(100% - 40px)); padding: 32px 24px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { color: #667085; line-height: 1.7; }
    button { width: 100%; margin-top: 16px; padding: 13px 18px; border: 0; border-radius: 999px; background: #06c755; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { color: #c0392b; }
  </style>
</head>
<body>
  <main>
    <h1>使用 LINE 登入</h1>
    <p id="status">正在準備 LINE 登入…</p>
    <p id="error" hidden></p>
    <button id="loginButton" type="button" hidden>開啟 LINE 登入</button>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 請將這裡替換成 LINE Developers Console 建立的 LIFF ID。
    const LIFF_ID = window.PATRIA_LIFF_ID || '2011054194-YNQIwkml';
    const statusText = document.getElementById('status');
    const errorText = document.getElementById('error');
    const loginButton = document.getElementById('loginButton');

    function showError(message) {
      statusText.textContent = 'LINE 登入尚未完成';
      errorText.textContent = message;
      errorText.hidden = false;
      loginButton.hidden = false;
      loginButton.disabled = false;
    }

    async function completeLogin() {
      if (LIFF_ID.includes('請填入')) {
        showError('請先在 liff-login.html 設定 LIFF ID。');
        return;
      }

      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        loginButton.hidden = false;
        statusText.textContent = '請使用 LINE App 完成登入。';
        loginButton.onclick = () => liff.login({ redirectUri: location.href });
        return;
      }

      const idToken = liff.getIDToken();
      if (!idToken) throw new Error('LINE 沒有回傳 ID Token。');
      statusText.textContent = '登入驗證中…';
      const response = await fetch('/api/auth/line/liff', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Guest-Id': localStorage.getItem('patriaGuestId') || ''
        },
        credentials: 'include',
        body: JSON.stringify({
          idToken,
          guestId: localStorage.getItem('patriaGuestId') || ''
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'LINE 登入失敗。');
      location.replace('/?line_login=success');
    }

    completeLogin().catch(error => showError(error.message || 'LINE 登入失敗。'));
  </script>
</body>
</html>
