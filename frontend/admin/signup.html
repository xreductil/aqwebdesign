<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>註冊｜森森點心坊</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.webp">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.webp">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.webp">
  <link rel="manifest" href="./assets/site.webmanifest">

  <script>
    if (window.location.pathname.endsWith('/admin/signup')) {
      window.history.replaceState(null, '', `${window.location.pathname}.html${window.location.search}${window.location.hash}`);
    }
  </script>
  <script type="module" src="./assets/js/main-CnSylLUz.js"></script>
  <link rel="stylesheet" href="./assets/css/main-CM9hUMvt.css">
  <link rel="stylesheet" href="./password-toggle.css">
</head>

<body>


<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card " style="max-width:420px; width:100%;">
    <div class="card-body p-5">
      <div class="text-center mb-3">
     <div class="patria-admin-brand patria-auth-brand mb-4"><span class="patria-admin-icon"><i class="ti ti-tools-kitchen-2"></i></span><span class="patria-admin-copy"><strong>森森</strong><em>SENSEN BAKERY</em></span></div>
        <h1 class="card-title mb-5 h5">Create your account</h1>

      </div>

      <form class="needs-validation mt-3" novalidate>
        <div class="mb-3">
          <label for="fullName" class="form-label">Full name</label>
          <input id="fullName" type="text" class="form-control" placeholder="Jane Doe" required>
          <div class="invalid-feedback">Please enter your name.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="password-field"><input id="password" type="password" class="form-control" placeholder="Create a password" required minlength="6"><button class="password-toggle" type="button" data-password-toggle="password" aria-label="顯示密碼" title="顯示密碼"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div>
          <div class="invalid-feedback">Please provide a password (min 6 characters).</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <div class="password-field"><input id="confirmPassword" type="password" class="form-control" placeholder="Repeat password" required
            oninput="this.setCustomValidity(document.getElementById('password').value !== this.value ? 'Passwords do not match.' : '')">
            <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="顯示密碼" title="顯示密碼"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div>
          <div class="invalid-feedback">Passwords must match.</div>
        </div>

        <div class="mb-3 form-check">
          <input id="terms" class="form-check-input" type="checkbox" required>
          <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-decoration-none">terms and privacy</a></label>
          <div class="invalid-feedback">You must agree before continuing.</div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Sign up</button>
      </form>

      <div class="text-center mt-3 small text-muted">
        Already have an account? <a href="signin.html" class="link-primary">Sign in</a>
      </div>
    </div>
  </div>
</div>



  <!-- Bootstrap JS -->


<script src="./assets/zh-admin.js?v=sensen-20260814"></script>
<script src="./password-toggle.js"></script>
</body>

</html>""
