<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>員工後台 | FOODIE</title><style>
  :root{--yellow:#ffc43f;--green:#5da95d;--ink:#222;--muted:#6b7280;--line:#ececec;--soft:#fff9ec;}
  *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,'Noto Sans TC',sans-serif;background:#f8faf9;color:var(--ink)}
  a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 20px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:900;margin-bottom:28px}.brand b{color:#f7b500}.brand span{display:block;color:#8b8b8b;font-size:11px;letter-spacing:2px}.nav{display:grid;gap:8px}.nav button,.nav a{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;font-weight:800;color:#46515a;cursor:pointer}.nav .active,.nav button:hover,.nav a:hover{background:#fff4d3;color:#1f2937}.main{padding:28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.btn{border:0;border-radius:999px;background:var(--yellow);padding:10px 16px;font-weight:900;cursor:pointer}.btn.dark{background:#222;color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.red{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.04)}.metric{display:flex;gap:14px;align-items:center}.metric i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#fff4d3;color:#f0a800;font-style:normal;font-weight:900}.metric strong{font-size:28px;display:block}.muted{color:var(--muted)}.panel{display:none}.panel.active{display:block}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}.status{display:inline-block;padding:5px 10px;border-radius:999px;background:#fff7d6;color:#9a6a00;font-size:12px;font-weight:800}.status.Completed{background:#dcfce7;color:#166534}.status.Cancelled{background:#fee2e2;color:#991b1b}.status.Processing{background:#fff7d6;color:#9a6a00}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}.product-cell{display:flex;align-items:center;gap:12px}.product-cell img{width:52px;height:52px;object-fit:contain;background:#f7f7f7;border-radius:12px}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:30;padding:18px}.modal.show{display:grid}.modal-card{background:#fff;border-radius:18px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.menu-toggle,.mobile-nav,.sidebar-backdrop{display:none}body.menu-open{overflow:hidden}@media(max-width:850px){.shell{grid-template-columns:1fr}.mobile-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:26;min-height:68px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 10px 30px rgba(15,23,42,.08)}.mobile-brand{display:block;margin:0;font-size:20px;line-height:1}.menu-toggle{display:grid;place-items:center;gap:4px;position:static;z-index:27;width:44px;height:44px;border:0;border-radius:12px;background:var(--yellow);padding:0;cursor:pointer;flex:0 0 auto}.menu-toggle span{display:block;width:20px;height:2px;border-radius:999px;background:#222;transition:transform .2s ease,opacity .2s ease}.menu-toggle.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}.menu-toggle.open span:nth-child(2){opacity:0}.menu-toggle.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}.sidebar-backdrop{display:block;position:fixed;inset:0;z-index:23;background:rgba(15,23,42,.46);opacity:0;pointer-events:none;transition:opacity .2s ease}.sidebar-backdrop.open{opacity:1;pointer-events:auto}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,320px);height:auto;z-index:24;overflow-y:auto;transform:translateX(-105%);transition:transform .24s ease;box-shadow:18px 0 60px rgba(15,23,42,.24)}.sidebar.open{transform:translateX(0)}.main{padding-top:28px}.form{grid-template-columns:1fr}}
</style></head><body data-page="staff"><header class="mobile-nav"><a class="brand mobile-brand" href="index.html"><b>FOODIE</b><span>GROCERY STORE</span></a><button class="menu-toggle" data-menu aria-label="開啟選單" aria-expanded="false"><span></span><span></span><span></span></button></header><div class="sidebar-backdrop" data-sidebar-close></div><div class="shell"><aside class="sidebar"><div class="brand"><b>FOODIE</b><span>GROCERY STORE</span></div><nav class="nav"><button class="active" data-tab="overview">總覽</button><button data-tab="inventory">庫存管理</button><button data-tab="add-product">新增商品</button><button data-tab="orders">訂單</button><button data-tab="reports">報表</button><a href="index.html">返回商店</a></nav></aside><main class="main"><div class="topbar"><div><h1>員工後台</h1><p class="muted">管理商品、訂單、庫存與銷售資料。</p></div><a class="btn dark" href="index.html">返回商店</a></div><section id="overview" class="panel active"><div class="grid"><div class="card metric"><i>$</i><div><strong id="totalSales">$0.00</strong><span>總銷售額</span></div></div><div class="card metric"><i>品</i><div><strong id="productCount">0</strong><span>商品數</span></div></div><div class="card metric"><i>訂</i><div><strong id="orderCount">0</strong><span>訂單</span></div></div><div class="card metric"><i>售</i><div><strong id="itemsSold">0</strong><span>售出品項</span></div></div></div><div class="grid" style="margin-top:18px"><div class="card"><h2>近期訂單</h2><div class="table-wrap"><table class="table"><thead><tr><th>訂單</th><th>顧客</th><th>合計</th><th>狀態</th><th></th></tr></thead><tbody id="recentOrders"></tbody></table></div></div><div class="card"><h2>熱銷商品</h2><div id="topProducts"></div></div></div></section><section id="inventory" class="panel"><div class="card"><div class="topbar"><h2>庫存管理</h2><span class="muted" id="inventoryInfo"></span></div><div class="actions" style="margin-bottom:12px"><input id="searchProducts" placeholder="搜尋商品"><select id="categoryFilter"><option value="all">全部分類</option><option value="produce">蔬果</option><option value="bakery">烘焙</option><option value="drinks">飲品</option><option value="dairy">乳製品</option><option value="sauce">調味醬料</option></select><button class="btn ghost" id="exportCsv">匯出 CSV</button><button class="btn ghost" id="importCsv">匯入 CSV</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden></div><div class="table-wrap"><table class="table"><thead><tr><th>商品</th><th>代碼</th><th>分類</th><th>價格</th><th>單位</th><th>庫存</th><th>操作</th></tr></thead><tbody id="inventoryRows"></tbody></table></div></div></section><section id="add-product" class="panel"><div class="card"><h2>新增商品</h2><form class="form" id="productForm"><label>商品名稱<input name="title" required></label><label>SKU<input name="sku" placeholder="FD-1001"></label><label>分類<select name="category"><option value="produce">蔬果</option><option value="bakery">烘焙</option><option value="drinks">飲品</option><option value="dairy">乳製品</option><option value="sauce">調味醬料</option></select></label><label>價格<input name="price" type="number" step="0.01" min="0" required></label><label>單位<input name="unit" value="1 件"></label><label>庫存<input name="stock" type="number" min="0" value="20"></label><label style="grid-column:1/-1">圖片路徑<input name="img" value="images/thumb-bananas.webp"></label><label style="grid-column:1/-1">描述<textarea name="desc" rows="4"></textarea></label><button class="btn" type="submit">新增商品</button></form></div></section><section id="orders" class="panel"><div class="card"><h2>訂單</h2><div class="table-wrap"><table class="table"><thead><tr><th>訂單</th><th>顧客</th><th>品項</th><th>合計</th><th>狀態</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></div></div></section><section id="reports" class="panel"><div class="grid"><div class="card metric"><i>完</i><div><strong id="completedSales">$0.00</strong><span>已完成銷售</span></div></div><div class="card metric"><i>處</i><div><strong id="processingSales">$0.00</strong><span>處理中銷售</span></div></div><div class="card metric"><i>低</i><div><strong id="lowStock">0</strong><span>低庫存</span></div></div><div class="card metric"><i>缺</i><div><strong id="outStock">0</strong><span>缺貨</span></div></div></div></section></main></div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" data-close>×</button></div><div id="modalBody"></div></div></div><script src="js/foodie-dashboard.js"></script></body></html>
